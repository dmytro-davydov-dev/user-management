# Host-side development: publishes the database on localhost so the API, Prisma and the
# integration tests can run outside Docker. Port 5433 avoids clashing with a locally
# installed Postgres on 5432.
#   docker compose -f compose.yaml -f compose.dev.yaml up -d db   (or `pnpm db:up`)
services:
  db:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
