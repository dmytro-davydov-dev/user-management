# Full stack: db → migrate (one-shot) → api → web. Only web is meant for the browser.
# `--profile e2e` adds the Playwright runner; start it with `docker compose run`, not
# `up --exit-code-from` (that aborts the stack when the one-shot `migrate` exits).
# `pnpm e2e:docker` runs it against an isolated stack (see docs/testing.md).
name: user-management

x-database-url: &database-url postgresql://app:${POSTGRES_PASSWORD:-localdev}@db:5432/user_management

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: user_management
    ports:
      # Host-side dev and integration tests only; bound to localhost. Host port 5433 avoids
      # clashing with a locally installed Postgres on 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d user_management']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

  e2e:
    profiles: [e2e]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      E2E_BASE_URL: http://web:3000
    # Playwright's Chromium needs more than Docker's default 64 MB of shared memory.
    ipc: host
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
